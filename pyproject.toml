[tool.poetry]
name = "maa-api"
version = "0.1.0"
description = ""
authors = ["Chenzhipeng <2010768120@qq.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115"
uvicorn = ">=0.30"
pydantic = "^2.7"
sqlmodel = ">=0.0.22"
alembic = "^1.13"
aiosqlite = "^0.20"
httpx = "^0.27"
# jinja2 仍在使用（maa_api/model/core/executor.py 的邮件模板），
# 是否移除待 07 定稿，见 docs/02 §10 依赖变更
jinja2 = "^3.0.0"
adbutils = "^2.8.0"
ruamel-yaml = "^0.18.7"
apscheduler = "^3.11.0"
requests = { version = "^2.31.0", extras = ["socks"] }
tqdm = "^4.67.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
