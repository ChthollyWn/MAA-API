[tool.poetry]
name = "maa-api"
version = "0.1.0"
description = "以 MaaAssistantArknights 为内核的 FastAPI 服务"
authors = ["ChthollyWn <85938618+ChthollyWn@users.noreply.github.com>"]
readme = "README.md"
license = "AGPL-3.0-only"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.138,<1.0"
uvicorn = ">=0.30"
# uvicorn 自动选择 WebSocket 协议实现时需要服务端实现；M4 起的部署必须支持真实的
# /api/ws 升级。
websockets = ">=13.0"
pydantic = "^2.7"
sqlmodel = ">=0.0.22"
alembic = "^1.13"
aiosqlite = "^0.20"
# greenlet 必须显式声明：SQLAlchemy 只把它放进 sqlalchemy[asyncio] extra，且其平台
# 标记不覆盖 macOS arm64（标记里是 aarch64/x86_64/...，本机 platform.machine() 为
# "arm64"），导致异步引擎在 .venv 里抛 ValueError: the greenlet library is required。
# 实测见 docs/ENVIRONMENT.md 与 tests/fixtures/db_probe_findings.md §5。
greenlet = "^3.1"
httpx = "^0.27"
cryptography = ">=39.0.1"
# jinja2 仍在使用（maa_api/model/core/executor.py 的邮件模板），
# 是否移除待 07 定稿，见 docs/02 §10 依赖变更
jinja2 = "^3.0.0"
# 养成规划的线性规划求解器（M27，规格 §7.6）：`scipy.optimize.linprog` 走 HiGHS。
# 只在规划时 import，服务启动不加载；镜像体积代价见 docs/15。
scipy = ">=1.11"
# 向量矩阵运算（M76，V3-D42）：此前只是 scipy 的传递依赖，检索层直接 import 就必须显式声明。
numpy = ">=2.0"
adbutils = "^2.8.0"
ruamel-yaml = "^0.18.7"
apscheduler = "^3.11.0"
requests = { version = "^2.31.0", extras = ["socks"] }
tqdm = "^4.67.1"
# 可选 OTLP 导出（M68，docs/v3/16 §12）：只在配置了 trace.otlp_endpoint 时延迟
# 导入，基础安装不带。选 HTTP/protobuf 而不是 gRPC：Langfuse 只收 HTTP，Phoenix 的
# HTTP 入口也收 protobuf，而 gRPC 导出器要额外带体积很大的 grpcio。
opentelemetry-sdk = { version = ">=1.30,<2", optional = true }
opentelemetry-exporter-otlp-proto-http = { version = ">=1.30,<2", optional = true }
# 本地 ONNX 向量（M76，V3-D60）：只在 `rag.embedding_provider=local` 且第一次 embed 时
# 才 import，基础安装与远端 embedding 都不需要；模型文件不随包下载（见 docs/v3/16）。
onnxruntime = { version = ">=1.20", optional = true }
tokenizers = { version = ">=0.20", optional = true }
# IM 通道平台 SDK（M85，docs/v3/specs/m85 §4.2）：不放进默认安装集，按平台装
# `im-feishu` / `im-dingtalk` / `im-qq`。适配器在 start/send 时延迟导入，缺包只记
# 「未安装」，不影响服务启动与其他平台。Telegram 用已有 httpx，不需要 extra。
lark-oapi = { version = "^1.7.5", optional = true }
dingtalk-stream = { version = "^0.24.3", optional = true }
qq-botpy = { version = "^1.2.1", optional = true }

[tool.poetry.extras]
otlp = ["opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http"]
embed-local = ["onnxruntime", "tokenizers"]
im-feishu = ["lark-oapi"]
im-dingtalk = ["dingtalk-stream"]
im-qq = ["qq-botpy"]

[tool.poetry.group.dev.dependencies]
pytest = "^8"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
