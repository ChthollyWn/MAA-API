# 配置模板：复制为 config.yaml 后按需填写（config.yaml 不入库）
# 应用配置
app:
  # 访问密钥；留空则免鉴权
  access_token:
  # MaaCore 内核目录
  maa_core_path:
  # 系统代理；留空表示不使用
  proxy:

# 更新检查与下载配置
updates:
  # 可选下载加速前缀；留空时用官方地址
  download_prefix:
  # 每日更新检查的本地时间（小时，0-23）；默认 09:00
  check_hour: 9

# ADB 配置
adb:
  # adb 可执行文件路径
  path: /opt/homebrew/bin/adb
  # 设备连接地址
  address: 127.0.0.1:5555
  # 截图质量（1-95）；值越大越清晰
  screenshot_quality: 25
  # MaaCore 的 ADB 连接配置名
  connection_config: General
  # 扫描模拟器常用端口
  common_ports: [5555, 5556, 7555, 16384, 21503, 62001]

# 内核旋钮（M38）：识别间隔毫秒数。开机时写进一层资源，覆盖内核自带的 500。
# 100 让练度扫描读屏快一倍（一屏 13.3 → 6.6 秒）；0 最快但整链瞬时占满一个核。
core:
  task_delay: 100

# 任务全局默认客户端渠道（单任务显式参数优先）
channel:
  client_type: Bilibili
  server: CN

# 工作区：只读探索工具（list_files / read_file / search_code / delegate_recon）的根目录
workspace:
  # 只读探索工具的根目录；留空表示关闭探索能力
  # 相对路径按它解析，解析后必须仍在它里面；.env / config.yaml / *.pem 等密钥文件直接拒读
  root:

# 流水线失败或内核崩溃后，自动创建可继续追问的诊断会话
agent:
  auto_diagnose_failures: true
  # 干员数据（距上次森空岛同步）与仓库数据超过多少天算过期；概要接口与 Agent 注入据此提示重新同步 / 重新识别
  box_stale_days: 14
  depot_stale_days: 3
  # 仓库识别的写库闸门：条目数低于下限就整轮不写；上一轮够多（≥ min_prev）时，
  # 本轮跌到「上一轮 × ratio」以下也整轮不写（两条都给 0 就等于关掉那道闸）
  depot_min_items: 20
  depot_drop_min_prev: 20
  depot_drop_ratio: 0.75
  # 作业研究（M29）：授权有效期与单次尝试的等待上限，单位分钟
  copilot_grant_minutes: 60
  copilot_attempt_timeout_minutes: 20
  # AI 草稿与作业站副本的保留天数；用户上传的与点过「保留」的永不自动清理
  copilot_retention_days: 7
  # 只读侦察 subagent（M48）：一次委派的步数上限（1-20），用尽照常出报告
  recon_max_steps: 8
  # 侦察过程中工具输出的逐次截断（字符，1000-200000）；截断处给出续读偏移
  recon_output_chars: 20000
  # 一次侦察的累计字符预算，超出即收尾（字符，10000-2000000）
  recon_max_chars: 200000

# OpenAI 兼容模型；密钥建议通过环境变量或设置页录入，数据库里的密钥由 MAA_LLM_ENCRYPTION_KEY 加密
llm:
  base_url: https://api.deepseek.com
  api_key:
  model: deepseek-flash

# 邮件通知
smtp:
  server: smtp.qq.com
  port: 587
  email:
  password:

# Web Push（PWA 推送通知）：用 scripts/generate_vapid_keys.py 生成密钥对后粘贴到这里
# 私钥必须保持稳定，换密钥会让所有已建立的浏览器订阅静默失效
notify:
  vapid_private_key:
  # JWT 的 sub，推送服务用它联系站点管理员；改成你自己的邮箱
  vapid_subject: mailto:admin@example.com

# 部署：反向代理与浏览器来源（tailscale serve / Caddy 等）
deployment:
  # 信任来自哪些地址的代理头；默认只信任回环。
  # 不要写 "*"：那等于允许任何客户端伪造来源与协议，绕过限流并使 cookie 的 Secure 判定失真。
  forwarded_allow_ips: 127.0.0.1
  # 追加的浏览器来源白名单，例如 tailscale serve 分配的域名
  cors_origins: []
  # 追加的来源正则（整条匹配），用于 *.ts.net 这类通配域名
  cors_origin_regex: ""

# 外部数据源（PRTS 等只读内容；改完立即生效，不需要重启）
sources:
  # 总开关；关掉等于所有外部来源不可用，工具与注入段退回本机资源包
  enabled: true
  # 外部请求是否走 app.proxy；proxy 为空时直连
  use_proxy: true
  # 当期数据（活动列表、卡池、搜索结果）的缓存时长，秒
  cache_live_seconds: 300
  # 稳定数据（页面正文、SMW/Cargo 查询）的缓存时长，秒
  cache_static_seconds: 21600
  # 拆包关卡文件（几个月才变一次）的缓存时长，秒
  cache_level_seconds: 86400
  # 拆包关卡数据的镜像顺序（M29，规格 §9.3）；都失败且下面开关为真时再走 GitHub API
  gamedata_mirrors:
    - https://fastly.jsdelivr.net/gh/Kengxxiao/ArknightsGameData@master
    - https://cdn.jsdelivr.net/gh/Kengxxiao/ArknightsGameData@master
  gamedata_github_api_fallback: true
  # 拆包数据开关与每分钟请求上限（关卡文件、升级经验/龙门币常量表）
  gamedata_enabled: true
  gamedata_rate_per_minute: 10
  # 进程内缓存的内存上限（MB），超出按 LRU 淘汰
  cache_max_mb: 64
  prts_enabled: true
  # 每分钟请求上限；站点短时限流时会自动退让
  prts_rate_per_minute: 30
  # 企鹅物流（掉率数据，许可 CC BY-NC 4.0）；关掉后 get_drop_rates 无数据
  penguin_enabled: true
  # 主机二选一：penguin-stats.io / penguin-stats.cn；两边内容一致，失败时自动改试另一个
  penguin_host: penguin-stats.io
  # 每分钟请求上限；一次查询只取整表，缓存 6 小时
  penguin_rate_per_minute: 10
  # 作业站（prts.maa.plus，M29）；关掉后作业站搜索与导入直接报来源已关闭
  copilot_site_enabled: true
  # 每分钟请求上限 1-60；改完立即生效，作业搜索与作业内容下载共用这个桶
  copilot_site_rate_per_minute: 20

# 森空岛账号数据（M42）。三项都不进设置 API、不落库，只能从这里或环境变量给。
skland:
  # 凭据加密密钥（Fernet key）。生成：.venv/bin/python scripts/generate_skland_key.py
  # 留空即「没配」：绑定端点会回 409 SKLAND_ENCRYPTION_KEY_INVALID，已有凭据也解不开。
  # 换密钥会让已保存的凭据失效（需要重新扫码绑定），所以先在页面上解绑再换。
  credential_key: ""
  # 定时同步间隔（分钟）：0 = 关闭（默认）。非 0 时必须 ≥ 60 —— 这是非官方接口，
  # 本项目的取舍是「手动为主、定时兜底」，不允许配出比每小时更密的轮询。
  auto_sync_interval_minutes: 0
  # 单次出站请求超时（秒）
  request_timeout_seconds: 15.0
