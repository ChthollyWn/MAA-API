# Alembic 配置（docs/04 §8.1、§8.2）。
#
# 三条纪律：
# 1. script_location 指向包内目录，迁移脚本随代码一起走版本管理。
# 2. 版本文件名模板固定为「四位序号_说明」。本项目是单人线性开发，序号让
#    「第几个迁移」一目了然，也避免 down_revision 链在 review 时难以核对；
#    不使用随机 hash。新增迁移手工递增：0001、0002、……
#    （ini 里 %% 是 configparser 的百分号转义，读到的模板是 %(rev)s_%(slug)s。）
# 3. sqlalchemy.url 故意不在这里写死：env.py 优先取调用方显式 set_main_option
#    的值（maa_api/db/migrate.py 的 ensure_schema 会设），缺省回退到
#    maa_api.db.session.SYNC_URL。这样测试与 CLI 都能指向任意临时库。
[alembic]
script_location = maa_api/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# Alembic 1.20 起显式要求：prepend_sys_path 的分隔符语义（os.pathsep），
# 不写会发 DeprecationWarning。
path_separator = os
